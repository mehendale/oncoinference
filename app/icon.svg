<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk','Segoe UI',Inter,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .navy   { fill:#E8E8E8; }
      .teal   { fill:#189E93; }
      .coral  { fill:#FF6A52; }
      .lineNavy { stroke:#E8E8E8; stroke-width:2.2; }
      .lineTeal { stroke:#189E93; stroke-width:2.2; }
    </style>
  </defs>

  <!-- ================= ICON MARK ================= -->
  <!-- concept: a hexagonal cell / molecule ring (oncology) rewired as a
       node-and-edge network (inference) with one node "lit up" as the
       AI's flagged signal -->
  <g>
    <!-- outer ring edges (cell wall) -->
    <polygon points="100,55 52.4,82.5 52.4,137.5 100,165 147.6,137.5 147.6,82.5"
             fill="none" class="lineNavy" stroke-linejoin="round"/>

    <!-- spokes to center (inference connections) -->
    <line x1="100" y1="110" x2="100" y2="55"   class="lineTeal"/>
    <line x1="100" y1="110" x2="52.4" y2="82.5" class="lineTeal"/>
    <line x1="100" y1="110" x2="52.4" y2="137.5" class="lineTeal"/>
    <line x1="100" y1="110" x2="100" y2="165"  class="lineTeal"/>
    <line x1="100" y1="110" x2="147.6" y2="137.5" class="lineTeal"/>
    <line x1="100" y1="110" x2="147.6" y2="82.5"  class="lineTeal"/>

    <!-- signal pulse ring around the flagged node -->
    <circle cx="147.6" cy="82.5" r="15" fill="none" stroke="#FF6A52" stroke-width="1.6" opacity="0.45"/>

    <!-- nodes -->
    <circle cx="100" cy="55"    r="7" class="navy"/>
    <circle cx="52.4" cy="82.5" r="7" class="navy"/>
    <circle cx="52.4" cy="137.5" r="7" class="navy"/>
    <circle cx="100" cy="165"   r="7" class="navy"/>
    <circle cx="147.6" cy="137.5" r="7" class="navy"/>
    <circle cx="147.6" cy="82.5" r="8.5" class="coral"/>  <!-- flagged inference node -->
    <circle cx="100" cy="110"   r="11" class="teal"/>      <!-- core / nucleus -->
  </g>

  <!-- ================= WORDMARK ================= -->
  <text x="200" y="128" font-size="54" font-weight="700" letter-spacing="0.5">
    <tspan class="navy">onco</tspan><tspan class="teal">inference</tspan>
  </text>
  <text x="202" y="156" font-size="14.5" font-weight="500" letter-spacing="1" fill="#8A8F98">
    From molecular data to therapeutic insight.
  </text>
</svg>
